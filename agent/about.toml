# cargo-about configuration for THIRD_PARTY_NOTICES.md (scripts/gen-notices.sh).
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
targets = [
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "aarch64-pc-windows-msvc",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false

# Our own workspace crates (publish = false) are not third-party.
[private]
ignore = true
