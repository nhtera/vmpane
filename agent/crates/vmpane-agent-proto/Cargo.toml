[package]
name = "vmpane-agent-proto"
description = "Wire format shared by the VMPane guest agent and host: frames, JSON-RPC messages, method types, limits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# tokio-util Decoder/Encoder for the frame codec.
tokio-codec = ["dep:tokio-util"]

[dependencies]
bytes = "1.12.1"
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.21"
tokio-util = { version = "0.7.20", features = ["codec"], optional = true }

[lints]
workspace = true
