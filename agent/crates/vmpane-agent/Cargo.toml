[package]
name = "vmpane-agent"
description = "VMPane guest agent (system service)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
vmpane-agent-proto.workspace = true
bytes = "1.12.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt", "net", "io-util", "process", "time", "sync", "macros", "fs", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"
nix = { version = "0.31.3", features = ["fs", "ioctl", "net", "process", "signal", "time", "user"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = "0.7.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_System_Shutdown", "Win32_Security", "Win32_System_Threading", "Win32_System_IO", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "net", "io-util", "time", "macros"] }

[lints]
workspace = true
