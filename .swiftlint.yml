included:
  - App
  - VMHelper
  - CLI
  - UITests
  - Packages/VMPaneKit/Sources
  - Packages/VMPaneKit/Tests
excluded:
  - build
  - spikes
  - agent
  - Packages/VMPaneKit/.build
opt_in_rules:
  - force_unwrapping
  - empty_count
  - first_where
  - closure_spacing
  - implicit_return
  - sorted_imports
disabled_rules:
  - explicit_acl
  - todo
force_unwrapping: warning
line_length:
  warning: 140
  error: 200
  ignores_comments: true
identifier_name:
  excluded: [id, vm, ok, to]
