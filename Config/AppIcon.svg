<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- VMPane's app icon, "Stacked panes": three glass windows, the front one with a prompt.
       The master for App/Assets.xcassets/AppIcon.appiconset (scripts/gen-app-icon.sh). macOS icon grid:
       an 824 px rounded square centred on the 1024 px canvas, with the template's drop shadow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FC3FF"/><stop offset=".55" stop-color="#2A74FF"/><stop offset="1" stop-color="#1638B8"/></linearGradient>
    <radialGradient id="glow" cx=".3" cy=".08" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#E4EEFF"/></linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity=".18"/></linearGradient>
    <filter id="icon-shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".3"/></filter>
    <filter id="pane-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0A2A8A" flood-opacity=".42"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#icon-shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="104" y="104" width="816" height="816" rx="181" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="4"/>
  <g filter="url(#pane-shadow)">
    <rect x="352" y="214" width="452" height="336" rx="58" fill="url(#pane)" stroke="#fff" stroke-opacity=".85" stroke-width="5"/>
    <rect x="290" y="314" width="476" height="356" rx="62" fill="url(#pane)" stroke="#fff" stroke-opacity=".9" stroke-width="5"/>
    <rect x="220" y="418" width="510" height="384" rx="66" fill="url(#front)" stroke="#fff" stroke-width="5"/>
  </g>
  <path d="M410 222h336M348 322h360M282 426h380" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".9"/>
  <circle cx="276" cy="470" r="15" fill="#B9CCF2"/><circle cx="322" cy="470" r="15" fill="#B9CCF2"/><circle cx="368" cy="470" r="15" fill="#B9CCF2"/>
  <path d="M300 584l78 54-78 54" fill="none" stroke="#2468FF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M424 704h124" stroke="#2468FF" stroke-width="40" stroke-linecap="round"/>
</svg>
