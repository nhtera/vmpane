# XcodeGen spec. The generated VMPane.xcodeproj is gitignored: run `xcodegen generate` (scripts/bootstrap.sh does).
name: VMPane
options:
  bundleIdPrefix: app.vmpane
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  VMPaneKit:
    path: Packages/VMPaneKit
  VMPaneSpice:
    path: Packages/VMPaneSpice
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser
    exactVersion: 1.8.2
targets:
  VMPane:
    type: application
    platform: macOS
    sources: [App]
    settings:
      base:
        # Set as build settings: XcodeGen's `info:`/`entitlements:` keys would regenerate (overwrite) the files.
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/VMPane.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: app.vmpane.mac
        GENERATE_INFOPLIST_FILE: NO
        # The "Embed QEMU" phase copies whole directory trees; Xcode's script sandbox only allows declared
        # output files.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # QEMU for Windows guests, from qemu/scripts/package.sh: programs and libraries in Contents/Helpers/qemu,
      # firmware and data in Contents/Resources/qemu/share (data under Helpers would break code signing).
      # Without the bundle the app still builds (Linux and macOS guests only); make-dmg.sh refuses such an app.
      - name: Embed QEMU
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          bundle="$SRCROOT/build/qemu-bundle"
          app="$TARGET_BUILD_DIR/$WRAPPER_NAME"
          frameworks="$app/Contents/Helpers/VMPaneVM.app/Contents/Frameworks"
          rm -rf "$app/Contents/Helpers/qemu" "$app/Contents/Resources/qemu" "$frameworks" "$app/Contents/Resources/GuestTools"
          # The Linux guest tools (agent, installer; guest-tools/build-linux.sh), shared read-only with VZ Linux guests.
          if [[ -f "$SRCROOT/build/guest-tools/linux/SHA256SUMS" ]]; then
            mkdir -p "$app/Contents/Resources/GuestTools"
            ditto "$SRCROOT/build/guest-tools/linux" "$app/Contents/Resources/GuestTools/linux"
          else
            echo "warning: no Linux guest tools in build/guest-tools/linux (guest-tools/build-linux.sh); Linux guests get no agent"
          fi
          # The macOS guest tools ("VMPane Agent.pkg"; guest-tools/build-macos.sh), in macOS guests' shared folders.
          if [[ -f "$SRCROOT/build/guest-tools/macos/SHA256SUMS" ]]; then
            mkdir -p "$app/Contents/Resources/GuestTools"
            ditto "$SRCROOT/build/guest-tools/macos" "$app/Contents/Resources/GuestTools/macos"
          fi
          if [[ ! -x "$bundle/bin/qemu-system-aarch64" ]]; then
            echo "warning: no QEMU bundle at $bundle (qemu/scripts/package.sh); Windows guests will not run"
            exit 0
          fi
          # A Release build (the one Developer ID signs) takes only the bundle the committed inputs produce.
          if [[ "$CONFIGURATION" == Release ]]; then
            "$SRCROOT/qemu/scripts/check-bundle.sh" "$bundle"
          fi
          mkdir -p "$app/Contents/Helpers/qemu" "$app/Contents/Resources/qemu"
          ditto "$bundle/bin" "$app/Contents/Helpers/qemu/bin"
          ditto "$bundle/lib" "$app/Contents/Helpers/qemu/lib"
          ditto "$bundle/share" "$app/Contents/Resources/qemu/share"
          cp "$bundle/MANIFEST.json" "$app/Contents/Resources/qemu/MANIFEST.json"
          # The SPICE client libraries the helper weak-links, all of them or none (a partial set aborts at launch).
          ditto "$bundle/frameworks" "$frameworks"
          # The Windows guest tools of the version in guest-tools/tools.lock (guest-tools/build-iso.sh). A Windows
          # install clones the ISO into the VM bundle.
          tools_version=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' "$SRCROOT/guest-tools/tools.lock")
          tools="$SRCROOT/build/guest-tools/vmpane-guest-tools-windows-$tools_version.iso"
          if [[ ! -f "$tools" ]]; then
            echo "warning: no guest-tools ISO in build/guest-tools (guest-tools/build-iso.sh); Windows installs get no drivers"
          else
            mkdir -p "$app/Contents/Resources/GuestTools"
            cp "$tools" "$app/Contents/Resources/GuestTools/vmpane-guest-tools-windows.iso"
          fi
    dependencies:
      - package: VMPaneKit
        product: VMPaneCore
      - package: VMPaneKit
        product: VMPaneUI
      # Helper app and CLI are embedded in Contents/Helpers (not MacOS/: case-insensitive collision with VMPane).
      - target: VMPaneVM
        embed: true
        codeSign: false
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: VMPaneCLI
        embed: true
        codeSign: false
        copy:
          destination: wrapper
          subpath: Contents/Helpers
  VMPaneVM:
    type: application
    platform: macOS
    sources: [VMHelper]
    settings:
      base:
        INFOPLIST_FILE: Config/VMHelper-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/VMPaneVM.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: app.vmpane.mac.vm
        PRODUCT_NAME: VMPaneVM
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        # The SPICE client libraries (Windows display) are weak-linked against SpiceSDK's stubs and embedded in
        # Contents/Frameworks from the QEMU bundle; without them the helper still runs VZ VMs.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        OTHER_LDFLAGS: >-
          $(inherited) -L$(SRCROOT)/Packages/VMPaneSpice/SpiceSDK/stubs
          -weak-lglib-2.0.0 -weak-lgobject-2.0.0 -weak-lspice-client-glib-2.0.8
    dependencies:
      - package: VMPaneSpice
        product: VMPaneSpice
      - package: VMPaneKit
        product: VMPaneHost
      - package: VMPaneKit
        product: VMPaneVZ
      - package: VMPaneKit
        product: VMPaneCore
      - package: VMPaneKit
        product: VMPaneControl
      - package: VMPaneKit
        product: VMPaneUI
  # Target name differs from the product: `vmpane` and `VMPane` collide on case-insensitive APFS (build dirs).
  VMPaneCLI:
    type: tool
    platform: macOS
    sources: [CLI]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vmpane.mac.cli
        PRODUCT_NAME: vmpane
        PRODUCT_MODULE_NAME: VMPaneCLI
        SKIP_INSTALL: YES
        OTHER_CODE_SIGN_FLAGS: "--timestamp=none --identifier app.vmpane.mac.cli"
    dependencies:
      - package: VMPaneKit
        product: VMPaneCore
      - package: VMPaneKit
        product: VMPaneControl
      - package: VMPaneKit
        product: VMPaneMCP
      - package: swift-argument-parser
        product: ArgumentParser
  VMPaneUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.vmpane.mac.uitests
    dependencies:
      - target: VMPane
schemes:
  VMPane:
    build:
      targets:
        VMPane: all
        VMPaneVM: all
        VMPaneCLI: all
    test:
      targets: [VMPaneUITests]
