name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VMPane version
      description: From VMPane > About VMPane, or `vmpane --version`.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.7.3, MacBook Pro M4 Pro
    validations:
      required: true
  - type: dropdown
    id: guest
    attributes:
      label: Guest
      options: [macOS, Linux, Windows 11, Not guest-specific]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove passwords, keys and personal data before pasting.
      render: text
