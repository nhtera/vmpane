name: Select pinned Xcode
description: Use the Xcode in .xcode-version (via DEVELOPER_DIR, no sudo) and fail if it is not installed.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        want=$(tr -d '[:space:]' < .xcode-version)
        dir="/Applications/Xcode_$want.app/Contents/Developer"
        if [[ -d "$dir" ]]; then
          echo "DEVELOPER_DIR=$dir" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$dir"
        fi
        have=$(xcodebuild -version | awk 'NR==1 {print $2}')
        if [[ "$have" != "$want" ]]; then
          echo "::error::Xcode $want required, found $have"
          exit 1
        fi
