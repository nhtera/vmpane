name: Agent release

# Builds the guest agent for a release tag (v*), signs what can be signed, attests it and attaches it to the
# tag's draft release:
#   Linux    static aarch64 musl binary + installer + systemd units, SHA256SUMS (ubuntu-24.04-arm)
#   macOS    "VMPane Agent.pkg": Developer ID signed and notarized on the project's Mac (identities in its keychain),
#            when a runner there is configured (vars.MAC_RUNNER); otherwise the maintainer builds it (docs/release.md)
#   Windows  vmpane-agent.exe + MSI (windows-11-arm), not Authenticode-signed (the project has no Windows code-signing
#            certificate): their build-provenance attestation and SHA256SUMS are what a release checks
# Runs in the `agent-release` environment, which must require a reviewer; tags matching v* must be protected.
# Build-provenance attestations need a public repository (private personal repositories cannot store them).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04-arm
    environment: agent-release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo build --release --locked --target aarch64-unknown-linux-musl -p vmpane-agent
      - name: Stage
        run: |
          out=../build/agent-linux
          mkdir -p "$out"
          install -m 0755 target/aarch64-unknown-linux-musl/release/vmpane-agent "$out/vmpane-agent"
          install -m 0755 installer/linux/install.sh "$out/install.sh"
          install -m 0644 installer/linux/vmpane-agent.service installer/linux/vmpane-session.service "$out/"
          (cd "$out" && sha256sum vmpane-agent install.sh vmpane-agent.service vmpane-session.service >SHA256SUMS)
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/agent-linux/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-linux-arm64
          path: build/agent-linux

  # Only once the project's Mac runner is registered (repository variable MAC_RUNNER = true): a job for a missing
  # runner would sit queued and hold up the release.
  macos:
    if: contains(fromJSON('["push", "workflow_dispatch"]'), github.event_name) && vars.MAC_RUNNER == 'true'
    runs-on: [self-hosted, macOS, ARM64, vmpane]
    environment: agent-release
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, sign and notarize the package
        env:
          VMPANE_SIGN_IDENTITY: ${{ vars.VMPANE_SIGN_IDENTITY }}
          VMPANE_INSTALLER_IDENTITY: ${{ vars.VMPANE_INSTALLER_IDENTITY }}
          VMPANE_NOTARIZE: "1"
        run: |
          [[ -n $VMPANE_SIGN_IDENTITY && -n $VMPANE_INSTALLER_IDENTITY ]] || { echo "set the signing identity variables" >&2; exit 1; }
          guest-tools/build-macos.sh
          cp agent/target/aarch64-apple-darwin/release/vmpane-agent build/guest-tools/macos/vmpane-agent-macos-arm64
          (cd build/guest-tools/macos && shasum -a 256 vmpane-agent-macos-arm64 >>SHA256SUMS)
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/guest-tools/macos/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-macos-arm64
          path: build/guest-tools/macos
      - name: Clean workspace
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete

  windows:
    runs-on: windows-11-arm
    environment: agent-release
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Install WiX 3 and cargo-wix (pinned)
        run: |
          choco install wixtoolset --version 3.14.1 --no-progress -y
          # The installer sets WIX (and PATH) for new shells only: later steps get its bin through GITHUB_PATH.
          wix=$(powershell -NoProfile -Command '[Environment]::GetEnvironmentVariable("WIX", "Machine")' | tr -d '\r')
          [[ -n $wix && -f "$(cygpath -u "${wix}bin")/candle.exe" ]] || { echo "WiX 3 is not where WIX says: '$wix'"; exit 1; }
          echo "${wix}bin" >> "$GITHUB_PATH"
          cargo install --locked cargo-wix --version 0.3.9
      - run: cargo build --release --locked --target aarch64-pc-windows-msvc -p vmpane-agent
      # Windows has no Visual C++ runtime of its own: an agent that needs vcruntime140.dll never starts in a guest
      # (this runner has it, so running the binary here would not tell). agent/.cargo/config.toml links it in.
      - name: The agent needs no Visual C++ runtime
        run: |
          ! grep -a -q -i 'vcruntime140' target/aarch64-pc-windows-msvc/release/vmpane-agent.exe \
            || { echo "vmpane-agent.exe imports the Visual C++ runtime (crt-static missing?)"; exit 1; }
      - name: Build the MSI
        run: |
          cargo wix -p vmpane-agent --no-build --nocapture --target aarch64-pc-windows-msvc \
            --include installer/windows/main.wxs --output target/wix/vmpane-agent.msi
          mkdir -p ../build/agent-windows
          cp target/aarch64-pc-windows-msvc/release/vmpane-agent.exe target/wix/vmpane-agent.msi ../build/agent-windows/
          (cd ../build/agent-windows && sha256sum vmpane-agent.exe vmpane-agent.msi >SHA256SUMS)
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/agent-windows/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-windows-arm64
          path: build/agent-windows

  # Linux and Windows are required; the macOS package joins when the project's Mac runner built it.
  release:
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v')
      && needs.linux.result == 'success' && needs.windows.result == 'success'
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04-arm
    environment: agent-release
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: agent
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd agent
          for dir in agent-linux-arm64 agent-macos-arm64 agent-windows-arm64; do
            [[ -d $dir ]] || { echo "::warning::no $dir in this release"; continue; }
            (cd "$dir" && tar -czf "../vmpane-$dir-$TAG.tar.gz" .)
          done
          sha256sum ./*.tar.gz >SHA256SUMS-agent
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "VMPane $TAG" --notes "Draft: guest agent artifacts."
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*.tar.gz SHA256SUMS-agent
